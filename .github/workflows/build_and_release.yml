name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PlatformIO
        uses: n-vr/setup-platformio-action@v1

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install esptool
        run: pip install -U esptool

      - name: Generate release tag
        id: generate_release_tag
        uses: alexvingg/next-release-tag@v1.0.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ''

      - name: Build PlatformIO project
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
        run: pio run

      - name: Build filesystem
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
        run: pio run -t buildfs

      - name: Merge bin files for LilyGoLoraESP32
        run: |
          esptool --chip esp32 merge-bin \
            -o LilyGoLoraESP32.bin \
            --flash-size 4MB \
            0x1000  .pio/build/LilyGoLoraESP32/bootloader.bin \
            0x8000  .pio/build/LilyGoLoraESP32/partitions.bin \
            0x10000 .pio/build/LilyGoLoraESP32/firmware.bin \
            0x210000 .pio/build/LilyGoLoraESP32/littlefs.bin

      - name: Merge bin files for HeltecLoraV2ESP32
        run: |
          esptool --chip esp32 merge-bin \
            -o HeltecLoraV2ESP32.bin \
            --flash-size 8MB \
            0x1000  .pio/build/HeltecLoraV2ESP32/bootloader.bin \
            0x8000  .pio/build/HeltecLoraV2ESP32/partitions.bin \
            0x10000 .pio/build/HeltecLoraV2ESP32/firmware.bin \
            0x670000 .pio/build/HeltecLoraV2ESP32/littlefs.bin

      - name: Find bootloader and boot_app0 for LilyGoT3S3
        id: t3s3_paths
        run: |
          BOOT=$(find ~/.platformio -name "bootloader_dout_80m.bin" 2>/dev/null | grep -i esp32s3 | head -1)
          if [ -z "$BOOT" ]; then
            BOOT=$(find .pio/build/LilyGoT3S3 -name "bootloader.bin" 2>/dev/null | head -1)
          fi
          if [ -z "$BOOT" ]; then
            BOOT=$(find ~/.platformio -name "bootloader*.bin" 2>/dev/null | grep -i esp32s3 | head -1)
          fi
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" 2>/dev/null | head -1)
          echo "bootloader=$BOOT" >> $GITHUB_OUTPUT
          echo "boot_app0=$BOOT_APP0" >> $GITHUB_OUTPUT
          echo "Bootloader: $BOOT"
          echo "boot_app0 : $BOOT_APP0"
          ls -la .pio/build/LilyGoT3S3/

      - name: Merge bin files for LilyGoT3S3
        run: |
          esptool --chip esp32s3 merge-bin \
            -o LilyGoT3S3.bin \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 16MB \
            0x0000   ${{ steps.t3s3_paths.outputs.bootloader }} \
            0x8000   .pio/build/LilyGoT3S3/partitions.bin \
            0xe000   ${{ steps.t3s3_paths.outputs.boot_app0 }} \
            0x10000  .pio/build/LilyGoT3S3/firmware.bin \
            0x210000 .pio/build/LilyGoT3S3/littlefs.bin

      - name: Prepare firmware files for release
        run: |
          mv .pio/build/LilyGoLoraESP32/firmware.bin  LilyGoLoraESP32_firmware.bin
          mv .pio/build/LilyGoLoraESP32/littlefs.bin  LilyGoLoraESP32_filesystem.bin
          mv .pio/build/HeltecLoraV2ESP32/firmware.bin HeltecLoraV2ESP32_firmware.bin
          mv .pio/build/HeltecLoraV2ESP32/littlefs.bin HeltecLoraV2ESP32_filesystem.bin
          mv .pio/build/LilyGoT3S3/firmware.bin        LilyGoT3S3_firmware.bin
          mv .pio/build/LilyGoT3S3/littlefs.bin        LilyGoT3S3_filesystem.bin

      - name: "Generate release changelog"
        uses: janheinrichmerker/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: changelog.md
          onlyLastTag: true
          stripHeaders: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
          body_path: changelog.md
          prerelease: ${{ !startsWith(github.ref_name, 'v') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
          files: |
            LilyGoLoraESP32.bin
            LilyGoLoraESP32_firmware.bin
            LilyGoLoraESP32_filesystem.bin
            HeltecLoraV2ESP32.bin
            HeltecLoraV2ESP32_firmware.bin
            HeltecLoraV2ESP32_filesystem.bin
            LilyGoT3S3.bin
            LilyGoT3S3_firmware.bin
            LilyGoT3S3_filesystem.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            LilyGoLoraESP32.bin
            LilyGoLoraESP32_firmware.bin
            LilyGoLoraESP32_filesystem.bin
            HeltecLoraV2ESP32.bin
            HeltecLoraV2ESP32_firmware.bin
            HeltecLoraV2ESP32_filesystem.bin
            LilyGoT3S3.bin
            LilyGoT3S3_firmware.bin
            LilyGoT3S3_filesystem.bin
            changelog.md
