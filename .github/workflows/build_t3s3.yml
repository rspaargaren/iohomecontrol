name: Build LilyGoT3S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware (LilyGoT3S3)
        run: pio run -e LilyGoT3S3

      - name: Build filesystem (LilyGoT3S3)
        run: pio run -e LilyGoT3S3 -t buildfs

      - name: Show build output and flash_args
        run: |
          echo "=== .pio/build/LilyGoT3S3/ ==="
          find .pio/build/LilyGoT3S3/ -type f | sort
          echo ""
          echo "=== flash_args ==="
          cat .pio/build/LilyGoT3S3/flash_args 2>/dev/null || echo "flash_args not found"

      - name: Merge into single flashable bin
        run: |
          BUILD=.pio/build/LilyGoT3S3

          # Read flash_args generated by PlatformIO - it contains exact addresses and paths
          FLASH_ARGS=$(cat "$BUILD/flash_args")
          echo "flash_args contents: $FLASH_ARGS"

          # Replace relative paths in flash_args with absolute paths
          ARGS_FIXED=$(echo "$FLASH_ARGS" | sed "s| [^ ]*/| $BUILD/|g" | sed "s|~/.platformio|$HOME/.platformio|g")

          # Also fix boot_app0 which lives in the framework package, not build dir
          BOOT_APP0=$(find $HOME/.platformio -name "boot_app0.bin" 2>/dev/null | head -1)
          echo "boot_app0: $BOOT_APP0"

          # Extract the flash mode/freq/size options from flash_args line 1
          FLASH_OPTS=$(head -1 "$BUILD/flash_args")

          # Build the merge command from flash_args addresses
          # flash_args format: --flash_mode dio --flash_freq 80m --flash_size 16MB
          #                    0x0000 bootloader.bin 0x8000 partitions.bin 0xe000 boot_app0.bin 0x10000 firmware.bin ...
          python3 - <<'EOF'
import subprocess, re, os, sys, glob

build = ".pio/build/LilyGoT3S3"
with open(f"{build}/flash_args") as f:
    content = f.read().strip()

lines = content.splitlines()
opts_line = lines[0]   # --flash_mode dio --flash_freq 80m --flash_size 16MB
addr_line = " ".join(lines[1:])  # 0x0000 path 0x8000 path ...

# Parse opts
opts = opts_line.split()

# Parse address/file pairs
tokens = addr_line.split()
pairs = list(zip(tokens[0::2], tokens[1::2]))

home = os.path.expanduser("~")
resolved = []
for addr, path in pairs:
    # Try build dir first
    candidate = os.path.join(build, os.path.basename(path))
    if os.path.exists(candidate):
        resolved.append((addr, candidate))
        continue
    # Try absolute path
    if os.path.exists(path):
        resolved.append((addr, path))
        continue
    # Search in ~/.platformio
    hits = glob.glob(f"{home}/.platformio/**/{os.path.basename(path)}", recursive=True)
    if hits:
        resolved.append((addr, hits[0]))
        continue
    print(f"WARNING: could not find {path}", file=sys.stderr)

print("Resolved pairs:")
for a, p in resolved:
    print(f"  {a}  {p}")

cmd = ["esptool", "--chip", "esp32s3", "merge-bin",
       "-o", "LilyGoT3S3.bin",
       "--flash-mode", "dio",
       "--flash-freq", "80m",
       "--flash-size", "16MB"]
for addr, path in resolved:
    cmd += [addr, path]

print("Running:", " ".join(cmd))
result = subprocess.run(cmd)
sys.exit(result.returncode)
EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LilyGoT3S3-firmware
          retention-days: 30
          path: |
            LilyGoT3S3.bin
            .pio/build/LilyGoT3S3/firmware.bin
            .pio/build/LilyGoT3S3/littlefs.bin
            .pio/build/LilyGoT3S3/partitions.bin
