name: Build LilyGoT3S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware (LilyGoT3S3)
        run: pio run -e LilyGoT3S3

      - name: Build filesystem (LilyGoT3S3)
        run: pio run -e LilyGoT3S3 -t buildfs

      - name: Show all build output
        run: |
          echo "=== .pio/build/LilyGoT3S3/ ==="
          find .pio/build/LilyGoT3S3/ -type f | sort
          echo "=== PlatformIO flash args ==="
          cat .pio/build/LilyGoT3S3/flash_args 2>/dev/null || echo "flash_args not found"
          echo "=== boot_app0 search ==="
          find ~/.platformio -name "boot_app0.bin" 2>/dev/null
          echo "=== bootloader search ==="
          find ~/.platformio -name "bootloader*.bin" 2>/dev/null | head -10

      - name: Merge into single flashable bin
        run: |
          BUILD=.pio/build/LilyGoT3S3

          # PlatformIO stores bootloader in the build dir under different names
          # or references it via flash_args - find it wherever it is
          BOOTLOADER=$(find .pio ~/.platformio -name "bootloader*.bin" 2>/dev/null | grep -i "esp32s3\|LilyGoT3S3" | head -1)
          if [ -z "$BOOTLOADER" ]; then
            BOOTLOADER=$(find .pio ~/.platformio -name "bootloader*.bin" 2>/dev/null | head -1)
          fi

          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" 2>/dev/null | head -1)

          echo "bootloader : $BOOTLOADER"
          echo "boot_app0  : $BOOT_APP0"
          ls -la "$BUILD/"

          esptool --chip esp32s3 merge-bin \
            -o LilyGoT3S3.bin \
            --flash-size 16MB \
            --flash-mode dio \
            --flash-freq 80m \
            0x0000   "$BOOTLOADER" \
            0x8000   "$BUILD/partitions.bin" \
            0xe000   "$BOOT_APP0" \
            0x10000  "$BUILD/firmware.bin" \
            0x210000 "$BUILD/littlefs.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LilyGoT3S3-firmware
          retention-days: 30
          path: |
            LilyGoT3S3.bin
            .pio/build/LilyGoT3S3/firmware.bin
            .pio/build/LilyGoT3S3/littlefs.bin
