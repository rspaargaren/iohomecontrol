; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = HeltecLoraV2ESP32, LilyGoLoraESP32, LilyGoT3S3
name = iownhcESP32
description = io-homecontrol for the ESP32
data_dir = ./extras

[common]
framework = arduino
board_build.filesystem = littlefs
lib_deps_builtin =
lib_deps_external =
build_flags =
	!python3 git_rev_macro.py
	-DDEBUG
	-DCORE_DEBUG_LEVEL=5
	-DCONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_1=y
	-DCONFIG_ESP_TIMER_PROFILING=y
	-DCONFIG_ESP_TIMER_SUPPORTS_ISR_DISPATCH_METHOD=y
	-DCONFIG_COMPILER_OPTIMIZATION_PERF=y
	-Wno-attributes
	-I include

extra_scripts =

[env]
framework = ${common.framework}
platform = espressif32
platform_packages = platformio/framework-arduinoespressif32
board_build.filesystem = ${common.board_build.filesystem}
board_build.embed_txtfiles = extras/github-ca.pem

check_tool = cppcheck, clangtidy
check_skip_packages = yes

lib_ldf_mode = deep
lib_deps =
	${common.lib_deps_builtin}
	bblanchon/ArduinoJson
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	https://github.com/HeMan/async-mqtt-client.git
	adafruit/Adafruit SSD1306 @ ^2.5.15
	tzapu/WiFiManager @ ^2.0.17
lib_ignore = AsyncTCP-esphome

upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
monitor_echo = true
monitor_filters = esp32_exception_decoder, send_on_enter, time, colorize

[env:debug]
build_type = debug
debug_build_flags = -O0 -ggdb3 -g3

[extra]
build_flags =
	-std=gnu++2a
	-O3

[env:HeltecLoraV2ESP32]
board = heltec_wifi_lora_32_V2
build_unflags =
	-std=gnu++11
	-Os
build_flags =
	-DHELTEC
	${common.build_flags}
	${extra.build_flags}

[env:LilyGoLoraESP32]
board = ttgo-lora32-v21
board_build.partitions = no_ota.csv
build_unflags =
	-std=gnu++11
	-Os
build_flags =
	-DLILYGO
	${common.build_flags}
	${extra.build_flags}

[env:LilyGoT3S3]
board = lilygo_t3_s3
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_unflags =
	-std=gnu++11
	-Os
build_flags =
	-DLILYGO_T3S3
	${common.build_flags}
	${extra.build_flags}
